name: tests

# No untrusted input is interpolated anywhere in this workflow: no github.event.*
# expressions reach a run: block, so there is no injection surface.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hooks:
    runs-on: ${{ matrix.os }}
    # 4 shards x 3 platforms. Sharding makes nothing faster and bills the same minutes --
    # the same suites run, on the same runners. What it splits is the WALL CLOCK, and only
    # the Windows leg needed it: measured on f5433e2, windows-latest ran this list
    # sequentially in 1,305s against ubuntu's 162s for the same commit, because a process
    # launch on that platform costs roughly ten times what it costs elsewhere.
    #
    # fail-fast stays false: a shard that goes red must not cancel the other three, or the
    # first failure hides every other suite's verdict -- which is the same absence this
    # repository is about, one level up in the CI.
    #
    # The partition itself is asserted by tests/test-run-all-shard.sh, not by this file: a
    # suite in no shard runs NOWHERE, and a leg that ran 30 of 45 suites is green exactly
    # the way a leg that ran all 45 is. That suite proves the union of every shard is the
    # complete list and that nothing appears twice.
    name: hooks (${{ matrix.os }}, shard ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [1, 2, 3, 4]
    # windows-latest would otherwise run these steps in pwsh, where a `| head -1`
    # pipeline is not a shell pipeline at all. Git Bash ships on the runner.
    defaults:
      run:
        shell: bash
    env:
      # The two containment suites build their fixtures with `ln -s`. Without this the MSYS
      # runtime COPIES the target instead of linking it, the suites cannot construct the
      # attack they exist to refuse, and they skip -- which is what happened on 0.3.0, where
      # the containment guard was exercised nowhere on Windows while a Windows clone with
      # core.symlinks=true carries real links (#33). Ignored on Linux and macOS.
      MSYS: winsymlinks:nativestrict
      # And SAY that this environment was configured to have them. A probe that reports "no"
      # after we asked is a broken configuration, not a platform without the capability: the
      # suites fail on it instead of skipping, because run-all.sh renders a skip green and
      # this setting silently ceasing to apply would restore the hole unnoticed.
      JIT_TESTS_REQUIRE_SYMLINKS: "1"
    steps:
      # Before checkout, so it applies to it. Nothing in this repository is a committed
      # symlink today (`git ls-files -s | awk '$1=="120000"'` is empty) and every fixture is
      # built at runtime -- this covers the day one is committed, when a checkout that
      # materialised it as a text file would be the same silent hole one level down.
      - name: Let the checkout carry symbolic links (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      # fetch-depth: 0 (full history), not the default shallow depth-1 clone -- #212's A2
      # control resolves "pre-fix" by walking scripts/rebuild-tsv.sh's own git history for
      # the commit that introduced the fix (git log -S), then takes that commit's parent.
      # A depth-1 checkout has no history to walk: git log -S can only see the commit it
      # already has, A2 falls through to its NOT_EVALUATED branch on every run, and the
      # control this suite exists to prove is red never actually evaluates in CI at all.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Show interpreter versions
        run: |
          bash --version | head -1
          awk --version 2>/dev/null | head -1 || awk -W version 2>&1 | head -1
          perl --version | sed -n 2p
      # The suites print `symlink support: yes|no` themselves; this states the same thing
      # once, up front, so the answer to "did #33 take" is at the top of the log rather than
      # inside a suite. It never fails the job -- the suites own that verdict.
      - name: Report whether this runner makes real symbolic links
        run: |
          d="$RUNNER_TEMP/symlink-probe"; rm -rf "$d"; mkdir -p "$d/target-dir"
          printf 'probe\n' > "$d/target-file"
          ln -sf "$d/target-file" "$d/link-file" 2>/dev/null
          ln -sfn "$d/target-dir" "$d/link-dir" 2>/dev/null
          printf 'late\n' > "$d/target-dir/late.txt"
          if [ -L "$d/link-file" ] && [ -L "$d/link-dir" ] && [ -f "$d/link-dir/late.txt" ]; then
            echo "symbolic links: yes (MSYS=${MSYS:-<unset>})"
          else
            echo "symbolic links: NO (MSYS=${MSYS:-<unset>}) -- the containment suites will fail below"
          fi
      # Defender's real-time scanner walks every file this job touches on the runner's
      # own disk -- and the suites create many small temp files per assertion (each
      # `mktemp` fixture, each rewritten .claude/jit-context/ under test). This is a
      # documented GitHub Actions cost specific to windows-latest: macOS and Linux
      # runners carry no equivalent always-on scanner. Excluding the checkout and the
      # runner temp directory removes that tax without touching what any suite tests --
      # it changes nothing about correctness, only how fast the disk answers.
      - name: Exclude the checkout and temp dir from Windows Defender scanning
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
      - name: Run hook test suites
        run: bash tests/run-all.sh --shard ${{ matrix.shard }}/4

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: shellcheck -S warning scripts/*.sh tests/*.sh
