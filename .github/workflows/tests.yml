name: tests

# No untrusted input is interpolated anywhere in this workflow: no github.event.*
# expressions reach a run: block, so there is no injection surface.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hooks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Show interpreter versions
        run: |
          bash --version | head -1
          awk --version 2>/dev/null | head -1 || awk -W version 2>&1 | head -1
          perl --version | sed -n 2p
      - name: Run hook test suites
        run: bash tests/run-all.sh

  # Non-blocking probe. Windows is documented as unsupported; this exists to find
  # out whether that is still true, not to gate the build. A green run here proves
  # the scripts are portable under Git Bash — it does NOT prove the plugin works on
  # Windows, which depends on Claude Code being able to invoke bash from hooks.json.
  windows-probe:
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Show interpreter versions
        run: |
          bash --version | head -1
          awk --version 2>/dev/null | head -1 || awk -W version 2>&1 | head -1
          perl --version | sed -n 2p
      - name: Run hook test suites
        run: bash tests/run-all.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: shellcheck -S warning scripts/*.sh tests/*.sh
